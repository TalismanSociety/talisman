name: API Health Tests

on:
  schedule:
    - cron: "0 7 * * *" # daily at 9:00 AM (UTC+2)
  workflow_dispatch: # allow manual trigger

concurrency:
  group: api-health
  cancel-in-progress: true

jobs:
  api-health:
    name: "API health checks"
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Run API health tests
        run: pnpm exec playwright test --project=api
        env:
          TDA_API_KEY: ${{ secrets.TDA_API_KEY }}
          SN45_API_KEY: ${{ secrets.SN45_API_KEY }}
          SIMPLESWAP_API_KEY: ${{ secrets.SIMPLESWAP_API_KEY }}

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: api-health-report
          path: playwright-report/
          retention-days: 7

      - name: Notify Discord on success
        if: success()
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"content":"Playwright API Health check passed ✅."}'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.PLAYWRIGHT_DISCORD_API_HOOK }}

      - name: Notify Discord on failure
        if: failure()
        run: |
          zip -r api-health-report.zip playwright-report/
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -F "content= Playwright API Health check failed ⚠️." \
            -F "files[0]=@api-health-report.zip"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.PLAYWRIGHT_DISCORD_API_HOOK }}
