name: Ledger e2e

# The Ledger flows of the wallet against Speculos, Ledger's device emulator (docs/ledger-emulator.md).
# Not a required check: it runs when Ledger code changes, and every night to catch what changes
# under it (the live Polkadot and Solana networks, the runner image).

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "apps/extension/src/ui/hooks/ledger/**"
      - "apps/extension/src/ui/domains/Sign/SignLedger*"
      - "apps/extension/src/ui/domains/Sign/useSignLedgerBase.ts"
      - "apps/extension/src/ui/domains/Sign/ErrorMessageDrawer.tsx"
      - "apps/extension/src/ui/domains/Account/Ledger*/**"
      - "apps/extension/src/ui/domains/Account/Ledger*"
      - "apps/extension/src/ui/domains/Account/AccountAdd/AccountAddLedger/**"
      - "scripts/ledger-emulator.sh"
      - "playwright/e2e-tests/ledger/**"
      - "playwright/e2e-tests/fixtures.ts"
      - "playwright.config.ts"
      - ".github/workflows/ledger-e2e.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ledger_e2e:
    name: "Ledger e2e tests on the Speculos emulator"
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # fork PRs have no secrets, and without the Gandalf creds the registration PoW starves the
    # background SW => e2e cannot pass on forks (same rule as the e2e job of ci.yml)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: $/.github/actions/setup-workspace
      - name: Build extension
        run: pnpm build:extension

      # The device apps are built from pinned commits (see fetch-apps in the script), which
      # takes a 4 GB builder image: the cache holds the three .elf files, keyed on the pins.
      - name: Compute the key of the device app cache
        id: apps
        run: echo "key=$(sh scripts/ledger-emulator.sh apps-key | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache Ledger device apps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/talisman/ledger-apps
          key: ledger-apps-${{ runner.os }}-${{ steps.apps.outputs.key }}
      - name: Get Ledger device apps
        run: sh scripts/ledger-emulator.sh fetch-apps

      - name: Cache playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-
      - name: Install playwright browser - chromium
        run: pnpm exec playwright install chromium
      - name: Install chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      # Chromium's new headless mode loads the extension without a display, so no xvfb.
      # The specs start Speculos and Anvil in Docker themselves, and use the public Speculos
      # recovery phrase: this job needs no mnemonic secret.
      - name: Run Ledger e2e tests
        run: pnpm test:e2e:ledger
        env:
          E2E_HEADLESS: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/ledger
          E2E_GANDALF_INSTALL_ID: ${{ secrets.E2E_GANDALF_INSTALL_ID }}
          E2E_GANDALF_PRIVATE_KEY: ${{ secrets.E2E_GANDALF_PRIVATE_KEY }}
      - name: Upload playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ledger-playwright-report
          path: playwright-report/
          retention-days: 30
