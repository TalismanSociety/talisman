packages:
  - ".papi/descriptors"
  - "apps/*"
  - "config/*"
  - "packages/*"
  - "lib/*"

# pnpm 11 only reads auth/registry settings from .npmrc; every other setting must
# live here (camelCase). See .npmrc for the rationale behind shamefullyHoist.
shamefullyHoist: true
useNodeVersion: 24.8.0
nodeOptions: "--max-old-space-size=4096"
savePrefix: ""

allowBuilds:
  '@sentry/cli': false
  '@swc/core': false
  bigint-buffer: false
  bufferutil: false
  es5-ext: false
  esbuild: false
  keccak: false
  node-hid: false
  secp256k1: false
  spawn-sync: false
  usb: false
  utf-8-validate: false

# don't install NPM dependencies which were published less than 3 days ago
# provides some buffer time for the package maintainer / wider community to detect and publicise malicious package versions
minimumReleaseAge: 4320

overrides:
  "@polkadot/api": "16.5.6"
  "@polkadot/api-augment": "16.5.6"
  "@polkadot/api-base": "16.5.6"
