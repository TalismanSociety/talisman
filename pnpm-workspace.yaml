packages:
  - ".papi/descriptors"
  - "apps/*"
  - "config/*"
  - "packages/*"

# pnpm 11 only reads auth/registry settings from .npmrc; every other setting must
# live here (camelCase). See .npmrc for the rationale behind shamefullyHoist.
shamefullyHoist: true
nodeVersion: 24.22.1
nodeOptions: "--max-old-space-size=4096"
savePrefix: ""

allowBuilds:
  '@swc/core': false
  bufferutil: false
  esbuild: false
  keccak: false
  secp256k1: false
  simple-git-hooks: false
  utf-8-validate: false

# don't install NPM dependencies which were published less than 3 days ago
# provides some buffer time for the package maintainer / wider community to detect and publicise malicious package versions
minimumReleaseAge: 4320

overrides:
  # dedupe @ledgerhq/hw-transport to a single copy — hw-app-eth/solana 7.x pin 6.36.0
  # and the web transports 6.35.5, which otherwise produces two incompatible Transport
  # types. The Transport API is stable across 6.x. devices follows transport.
  "@ledgerhq/devices": "8.18.1"
  "@ledgerhq/hw-transport": "6.36.1"
  # errors 7 only removed two type aliases; webhid/webusb still declare ^6.37.
  "@ledgerhq/errors": "7.0.0"
  # .papi/descriptors declares an open `polkadot-api: >=2.0.0` peer range (papi codegen
  # writes that file), which otherwise resolves to its own copy and ships a second
  # polkadot-api — and a second sync-provider — in the bundle. Keep in sync with the
  # polkadot-api version in the root package.json.
  "polkadot-api": "3.3.0"
  "elliptic": ">=6.6.1 <7.0.0"
  "semver": "7.8.5"
  "ws@>=7.0.0 <7.5.11": ">=7.5.11 <8.0.0"
  "ws@>=8.0.0 <8.21.0": ">=8.21.0 <9.0.0"
  # <6, not <5: a <5 cap moves elliptic (Ledger EVM signing) from bn.js 5 back to the 4.x it declares
  "bn.js@<4.12.3": ">=4.12.3 <6.0.0"
  "bn.js@>=5.0.0 <5.2.3": ">=5.2.3 <6.0.0"
  # <12 cap: uuid 11.x is the last line with a CJS entrypoint, some consumers still require()
  "uuid@<11.1.1": ">=11.1.1 <12.0.0"
  # 7.x has no patched release of its own; 8.0.0 is the fix line
  "deepmerge-ts@<8.0.0": ">=8.0.0 <9.0.0"
  # single resolution for ws's optional native peer, avoids peer-hash graph forks
  "utf-8-validate": "6.0.4"
  # dedupe to react 19 — transitive react-18 consumers (@ledgerhq/domain-service, react-icons,
  # icons/orb devDeps) otherwise load a second copy and break rendering ("React Element from an
  # older version of React"). All of them work on 19.
  "react": "19.3.1"
  "react-dom": "19.3.1"
  # dedupe @types/react too — icons/orb pin 18.3.12, extension 19.x; whichever hoists wins, and a
  # split makes react-icons' ReactNode (no bigint) clash with react 19's, breaking extension tsc.
  "@types/react": "19.3.0"
peerDependencyRules:
  allowAny:
    - "utf-8-validate"
