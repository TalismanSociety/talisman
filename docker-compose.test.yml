services:
  # Ethereum local devnet (Anvil / Foundry)
  # Exposes JSON-RPC on port 8545
  # 10 pre-funded accounts with 10,000 ETH each
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.6.0-rc1
    entrypoint: anvil
    command: --host 0.0.0.0 --chain-id 1 --block-time 1
    ports:
      - "8545:8545"
    healthcheck:
      test:
        [
          "CMD",
          "cast",
          "block-number",
          "--rpc-url",
          "http://localhost:8545",
        ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
